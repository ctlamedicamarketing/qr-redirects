<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SpineWave Training Deck Download</title>
  <meta name="description" content="Download the SpineWave training PowerPoint from GitHub Release." />
  <style>
    :root { --bg:#0e1116; --card:#151a22; --ink:#e8ecf1; --accent:#4ea1ff; }
    html,body{margin:0;background:var(--bg);color:var(--ink);
      font:16px/1.5 system-ui,Segoe UI,Roboto,Arial,sans-serif;}
    .wrap{max-width:700px;margin:4rem auto;padding:0 1rem;}
    .card{background:var(--card);border-radius:18px;padding:2rem;
      box-shadow:0 10px 30px rgba(0,0,0,.35);text-align:center;}
    h1{margin:.2rem 0 1rem 0;font-size:1.9rem}
    .pill{display:inline-block;background:#0f141b;border:1px solid #232a35;
      border-radius:999px;padding:.6rem 1rem;margin:.5rem 0;font-weight:500}
    .btn{display:inline-block;background:var(--accent);color:#001022;
      text-decoration:none;font-weight:700;padding:1rem 1.5rem;
      border-radius:12px;margin-top:1.5rem}
    .btn:hover{filter:brightness(1.08)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>SpineWave Training Deck (.pptx)</h1>
      <div class="pill">File size: <span id="filesize">…</span></div>
      <br/>
      <a id="downloadBtn" class="btn" href="#" download>⬇️ Download PowerPoint</a>
    </div>
  </div>

  <script>
    // ── Configure these four values ─────────────────────────────
    const OWNER    = "ctlamedicamarketing";
    const REPO     = "qr-redirects";
    const TAG      = "spinewave.training-1.0";
    const FILENAME = "KLIMT.MONET.Spinewave.Training.-.FINAL.pptx";
    // ───────────────────────────────────────────────────────────

    const api = `https://api.github.com/repos/${OWNER}/${REPO}/releases/tags/${encodeURIComponent(TAG)}`;
    const prettySize = (bytes) => {
      if (!Number.isFinite(bytes)) return "—";
      const units = ["B","KB","MB","GB"];
      let i=0; while (bytes>=1024 && i<units.length-1){bytes/=1024;i++;}
      return `${bytes.toFixed(1)} ${units[i]}`;
    };

    fetch(api).then(r=>r.json()).then(rel=>{
      const asset = (rel.assets||[]).find(a=>a.name===FILENAME) || rel.assets?.[0];
      const dl = asset
        ? asset.browser_download_url
        : `https://github.com/${OWNER}/${REPO}/releases/download/${encodeURIComponent(TAG)}/${encodeURIComponent(FILENAME)}`;
      document.getElementById("downloadBtn").href = dl;
      document.getElementById("filesize").textContent = asset ? prettySize(asset.size) : "—";
    }).catch(err=>{
      console.error(err);
      document.getElementById("downloadBtn").href =
        `https://github.com/${OWNER}/${REPO}/releases/tag/${TAG}`;
      document.getElementById("filesize").textContent = "—";
    });
  </script>
</body>
</html>
