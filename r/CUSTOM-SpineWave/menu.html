<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SpineWave — Menu Page</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="canonical" href="https://ctlamedicamarketing.github.io/qr-redirects/r/CUSTOM-SpineWave/menu.html" />

<!-- ===================== CONFIG (filled from your GA4) ===================== -->
<script>
  window.__CFG__ = {
    GA4_MEASUREMENT_ID: "G-FW2QWD6WKF",      // your GA4 Web stream ID
    GTM_CONTAINER_ID  : "",                  // optional GTM container
    CONSENT_REGION    : "us",
    CROSS_DOMAIN_HOSTS: ["ctlamedica.com","ctlamedicamarketing.github.io"],
    MP_ENDPOINT       : "",                  // optional Measurement Protocol relay
    UTM_DEFAULTS      : {
      utm_source  : "qr",
      utm_medium  : "github_pages",
      utm_campaign: "spinewave_menu",
      utm_content : "menu_choice"
    }
  };
</script>

<style>
  :root { --bg:#0b0c10; --ink:#e8eaed; --band1:#141823; --band2:#0f1320; --band3:#0b0f1b; --accent:#ffc81a; }
  * { box-sizing: border-box; } html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
  .stack { min-height: 100vh; display: grid; grid-template-rows: 1fr 1fr 1fr; }
  .band { display: grid; place-items: center; text-align: center; padding: 24px; border-top: 2px solid var(--accent); }
  .band:first-child { border-top: none; }
  .band > a { width: 100%; height: 100%; display: grid; place-items: center; text-decoration: none; color: var(--ink); }
  .band > a > span { padding: 14px 22px; border-radius: 12px; border: 1px solid rgba(255,255,255,.1); font-size: clamp(18px,3vw,32px); }
  .band > a:hover > span { border-color: var(--accent); }
  .band > a:focus-visible > span { outline: 3px solid var(--accent); outline-offset: 4px; }
  .b1 { background: var(--band1); } .b2 { background: var(--band2); } .b3 { background: var(--band3); }
  footer{position:fixed;left:0;right:0;bottom:0;text-align:center;font-size:12px;color:#a9b0bc;padding:8px 12px;pointer-events:none}
  .consent{position:fixed;inset:auto 12px 12px 12px;background:#0d111a;border:1px solid #1e2330;border-radius:12px;padding:12px;display:none;gap:8px;align-items:center;z-index:9999}
  .consent.show{display:flex}
  .btn{appearance:none;border:1px solid #1e2330;background:linear-gradient(180deg,#0f1320,#0b0f1b);color:var(--ink);padding:8px 12px;border-radius:10px;cursor:pointer;font-weight:600;text-decoration:none}
  .btn:hover{border-color:var(--accent)}
</style>

<!-- gtag/GTM loader + Consent Mode v2 defaults -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }

  const region = (window.__CFG__||{}).CONSENT_REGION || "us";
  const consentDefaults = (region === "eea")
    ? {ad_storage:"denied",analytics_storage:"denied",ad_user_data:"denied",ad_personalization:"denied"}
    : {ad_storage:"granted",analytics_storage:"granted",ad_user_data:"granted",ad_personalization:"granted"};
  gtag('consent','default', consentDefaults);

  document.addEventListener('DOMContentLoaded', () => {
    const key = 'spinewave-menu-consent';
    if (!localStorage.getItem(key)) document.querySelector('.consent')?.classList.add('show');
    function setConsent(granted){
      localStorage.setItem(key, granted?'granted':'denied');
      gtag('consent','update',{
        ad_storage: granted?'granted':'denied',
        analytics_storage: granted?'granted':'denied',
        ad_user_data: granted?'granted':'denied',
        ad_personalization: granted?'granted':'denied'
      });
      document.querySelector('.consent')?.classList.remove('show');
    }
    window.__acceptConsent=()=>setConsent(true);
    window.__denyConsent=()=>setConsent(false);
  });

  (function loadTags(){
    const { GA4_MEASUREMENT_ID, GTM_CONTAINER_ID } = window.__CFG__ || {};
    if (GTM_CONTAINER_ID){
      const s=document.createElement('script'); s.async=true;
      s.src="https://www.googletagmanager.com/gtm.js?id="+encodeURIComponent(GTM_CONTAINER_ID);
      document.head.appendChild(s);
    } else if (GA4_MEASUREMENT_ID){
      const s1=document.createElement('script'); s1.async=true;
      s1.src="https://www.googletagmanager.com/gtag/js?id="+encodeURIComponent(GA4_MEASUREMENT_ID);
      document.head.appendChild(s1);
      gtag('js', new Date());
      const domains=(window.__CFG__||{}).CROSS_DOMAIN_HOSTS||[];
      gtag('config', GA4_MEASUREMENT_ID, { linker:{domains}, send_page_view:true });
    }
  })();
</script>
</head>

<body>
<noscript>
  <iframe src="" height="0" width="0" style="display:none;visibility:hidden" id="gtm-noscript"></iframe>
  <script>
    (function(){ const id=(window.__CFG__||{}).GTM_CONTAINER_ID; if(!id) return;
      document.getElementById('gtm-noscript').src="https://www.googletagmanager.com/ns.html?id="+encodeURIComponent(id);
    })();
  </script>
</noscript>

<main class="stack" role="navigation" aria-label="Choose one of three destinations" id="menu">
  <div class="band b1">
    <a data-slug="monet"
       href="https://ctlamedicamarketing.github.io/qr-redirects/r/landing-page/monet/index.html"
       aria-label="Open MONET landing page">
      <span>MONET</span>
    </a>
  </div>

  <div class="band b2">
    <a data-slug="klimt"
       href="https://ctlamedicamarketing.github.io/qr-redirects/r/landing-page/klimt/index.html"
       aria-label="Open KLIMT landing page">
      <span>KLIMT</span>
    </a>
  </div>

  <div class="band b3">
    <a data-slug="mondrian-alif"
       href="https://ctlamedicamarketing.github.io/qr-redirects/r/landing-page/mondrian-alif/index.html"
       aria-label="Open MONDRIAN ALIF landing page">
      <span>MONDRIAN ALIF</span>
    </a>
  </div>
</main>

<footer>Tap any bar to continue • Links are fully keyboard-navigable (Tab / Enter)</footer>

<div class="consent" role="dialog" aria-live="polite" aria-label="Analytics consent">
  <span>Allow analytics cookies for improved measurement?</span>
  <button class="btn" onclick="__denyConsent()">No</button>
  <button class="btn" onclick="__acceptConsent()">Yes</button>
</div>

<script>
  function withUTMs(url){
    const cfg=(window.__CFG__||{}).UTM_DEFAULTS||{};
    const u=new URL(url, location.href);
    for(const [k,v] of Object.entries(cfg)) if(!u.searchParams.has(k)) u.searchParams.set(k,v);
    return u.toString();
  }
  function isOutbound(href){
    try{ const u=new URL(href, location.href); return u.hostname!==location.hostname; }
    catch { return false; }
  }
  function sendEvent(name, params){
    const ep=(window.__CFG__||{}).MP_ENDPOINT||"";
    if (ep && navigator.sendBeacon){
      try{
        navigator.sendBeacon(ep, new Blob([JSON.stringify({
          type:'client_event', name, params, ts:Date.now(), page:location.href, ua:navigator.userAgent
        })], {type:'application/json'}));
      }catch(e){}
    }
    if (typeof gtag==='function') gtag('event', name, params||{});
    else (window.dataLayer=window.dataLayer||[]).push({event:name, ...(params||{})});
  }

  // boot: record the scan and preserve inbound UTMs
  (function boot(){
    const q=new URLSearchParams(location.search);
    const utms={};
    ['utm_source','utm_medium','utm_campaign','utm_content','utm_term'].forEach(k=>{
      const v=q.get(k) || (window.__CFG__.UTM_DEFAULTS||{})[k]; if(v) utms[k]=v;
    });
    sendEvent('qr_scan', { page_location:String(location.href), ...utms });
  })();

  // add UTMs + log menu choice and outbound clicks
  document.addEventListener('click', (e)=>{
    const a=e.target.closest('a[href]'); if(!a) return;
    a.href = withUTMs(a.href);
    const slug = a.getAttribute('data-slug');
    if (slug) sendEvent('menu_choice', { slug, link_url:a.href });
    if (isOutbound(a.href)) sendEvent('click_outbound', { link_url:a.href, link_text:(a.textContent||'').trim().slice(0,120) });
  });
</script>
</body>
</html>
